trigger: none
pr: none

# Preliminary CI for an on-premises Azure DevOps Server Windows agent.
# Production configuration and secrets must not be compiled into this artifact.
pool:
  name: THub-Windows

variables:
  BuildConfiguration: Release
  RuntimeIdentifier: win-x64

steps:
- checkout: self
  clean: true

- task: PowerShell@2
  displayName: Build, test, and package THub production artifacts
  inputs:
    filePath: scripts/ci/New-THubCiArtifact.ps1
    arguments: >
      -Lane Production
      -Configuration "$(BuildConfiguration)"
      -RuntimeIdentifier "$(RuntimeIdentifier)"
      -OutputDirectory "$(Build.ArtifactStagingDirectory)\thub-production"
      -WorkDirectory "$(Agent.TempDirectory)\thub-ci-production-$(Build.BuildId)"
    pwsh: false

- task: PublishTestResults@2
  displayName: Publish test results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)\thub-ci-production-$(Build.BuildId)\test-results\**\*.trx'
    failTaskOnFailedTests: true
    testRunTitle: 'THub production CI $(Build.BuildNumber)'

- task: PublishBuildArtifacts@1
  displayName: Publish THub production artifact
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)\thub-production'
    ArtifactName: thub-production
    publishLocation: Container
